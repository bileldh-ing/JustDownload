# Local full stack: web (3000) + worker API (8080) + worker consumers + Redis.
#   cp .env.example .env   # then set WORKER_API_TOKEN and SIGNING_SECRET
#   docker compose up --build
name: justdownload

x-worker-env: &worker-env
  NODE_ENV: production
  REDIS_URL: redis://redis:6379
  WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
  SIGNING_SECRET: ${SIGNING_SECRET:?set SIGNING_SECRET in .env}
  PUBLIC_URL: ${WORKER_PUBLIC_URL:-http://localhost:8080}
  CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
  RETENTION_MINUTES: ${RETENTION_MINUTES:-60}
  MAX_SOURCE_MB: ${MAX_SOURCE_MB:-1024}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-512}
  MAX_DURATION_MIN: ${MAX_DURATION_MIN:-180}
  CONCURRENCY_VIDEO: ${CONCURRENCY_VIDEO:-1}
  CONCURRENCY_AUDIO: ${CONCURRENCY_AUDIO:-2}

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: ["redis-data:/data"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-api:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: justdownload-worker:local
    command: ["api"]
    environment: *worker-env
    ports: ["8080:8080"]
    volumes: ["jd-data:/data"]
    networks: [backend, egress]
    depends_on: { redis: { condition: service_healthy } }
    <<: *hardening
    mem_limit: 512m

  worker:
    image: justdownload-worker:local
    command: ["worker"]
    environment: *worker-env
    volumes: ["jd-data:/data"]
    networks: [backend, egress]
    depends_on:
      redis: { condition: service_healthy }
      worker-api: { condition: service_healthy }
    <<: *hardening
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_WORKER_PUBLIC_URL: ${WORKER_PUBLIC_URL:-http://localhost:8080}
    image: justdownload-web:local
    environment:
      NODE_ENV: production
      WORKER_URL: http://worker-api:8080
      WORKER_API_TOKEN: ${WORKER_API_TOKEN}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports: ["3000:3000"]
    networks: [backend, egress]
    depends_on: { worker-api: { condition: service_healthy } }
    <<: *hardening
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]

networks:
  backend: { internal: true }
  egress: {}

volumes:
  redis-data: {}
  jd-data: {}
